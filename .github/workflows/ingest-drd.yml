name: Ingest NHS discharge-ready-date data

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_drd.py"
      - ".github/workflows/ingest-drd.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 7 15 * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and analyse NHS DRD publication
        run: python scripts/ingest_drd.py
      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/drd-latest.json data/raw/drd-july-2026.csv
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update NHS discharge ready date data [skip ci]"
          git push
