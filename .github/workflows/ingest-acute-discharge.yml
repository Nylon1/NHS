name: Ingest NHS acute discharge causes

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_acute_discharge.py"
      - ".github/workflows/ingest-acute-discharge.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 7 15 * *"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and analyse acute discharge data
        run: python scripts/ingest_acute_discharge.py
      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/acute-discharge-latest.json data/raw/acute-discharge-august-2026.csv
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update acute discharge cause analysis [skip ci]"
          git push
